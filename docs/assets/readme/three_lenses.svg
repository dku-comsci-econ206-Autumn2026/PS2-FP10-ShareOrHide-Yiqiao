<title id="title">Three disciplinary lenses</title>
<desc id="desc">Game theory, social choice, and mechanism design flow into an interdisciplinary synthesis of strategic behavior, collective value, and institution design.</desc>
<defs><marker id="arrow-2563EB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><marker id="arrow-0F766E" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0F766E"/></marker><marker id="arrow-C2410C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C2410C"/></marker></defs>
