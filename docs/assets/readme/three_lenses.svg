"20" font-weight="600" font-style="normal" fill="#0F172A">welfare</text><text x="595" y="241" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#0F172A">first best</text><text x="595" y="271" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#0F172A">efficiency + fairness</text><line x1="595" y1="326" x2="600" y2="382" stroke="#C2410C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-C2410C)"/><rect x="790" y="125" width="330" height="190" rx="18" fill="#EAF8F2" stroke="#0F766E" stroke-width="3"/><text x="955" y="167" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="750" font-style="normal" fill="#0F766E">MECHANISM DESIGN</text><text x="955" y="211" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#0F172A">CCAR</text><text x="955" y="241" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#0F172A">incentives</text><text x="955" y="271" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" font-style="normal" fill="#0F172A">allocation rule</text><line x1="955" y1="326" x2="600" y2="382" stroke="#0F766E" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-0F766E)"/><rect x="260" y="388" width="680" height="88" rx="18" fill="#FFFFFF" stroke="#0B3D91" stroke-width="3"/><text x="600" y="422" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="750" font-style="normal" fill="#0B3D91">INTERDI