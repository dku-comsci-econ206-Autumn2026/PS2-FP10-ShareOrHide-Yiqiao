<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525" viewBox="0 0 1000 525" role="img" aria-labelledby="title desc">
<title id="title">Welfare gap by congestion</title>
<desc id="desc">Three labeled bars show welfare gaps of approximately 0.639 at low, 0.946 at medium, and 0.503 at high congestion, highlighting the medium state.</desc>
<defs><marker id="arrow-2563EB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><marker id="arrow-0F766E" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0F766E"/></marker><marker id="arrow-C2410C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C2410C"/></marker></defs>
<rect width="1000" height="525" rx="24" fill="#F8FAFC"/>
<text x="50" y="54" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700" font-style="normal" fill="#0B3D91">Why medium congestion matters</text><text x="50" y="86" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#475569">Welfare gap = full-information first best − Bayesian equilibrium</text><line x1="150" y1="415.0" x2="920" y2="415.0" stroke="#CBD5E1" stroke-width="1"/><text x="134" y="421.0" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#475569">0.00</text><line x1="150" y1="342.5" x2="920" y2="342.5" stroke="#CBD5E1" stroke-width="1"/><text x="134" y="348.5" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#475569">0.25</text><line x1="150" y1="270.0" x2="920" y2="270.0" stroke="#CBD5E1" stroke-width="1"/><text x="134" y="276.0" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#475569">0.50</text><line x1="150" y1="197.5" x2="920" y2="197.5" stroke="#CBD5E1" stroke-width="1"/><text x="134" y="203.5" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#475569">0.75</text><line x1="150" y1="125.0" x2="920" y2="125.0" stroke="#CBD5E1" stroke-width="1"/><text x="134" y="131.0" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#475569">1.00</text><rect x="260" y="229.66255087592302" width="150" height="185.33744912407698" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="3"/><text x="335" y="215.66255087592302" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="750" font-style="normal" fill="#2563EB">0.639</text><text x="335" y="451" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#0F172A">LOW</text><rect x="500" y="140.60149516811185" width="150" height="274.39850483188815" rx="10" fill="#FFF3E8" stroke="#C2410C" stroke-width="3"/><text x="575" y="126.60149516811185" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="750" font-style="normal" fill="#C2410C">0.946</text><text x="575" y="451" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#0F172A">MEDIUM</text><rect x="740" y="269.005470662422" width="150" height="145.99452933757803" rx="10" fill="#EAF8F2" stroke="#0F766E" stroke-width="3"/><text x="815" y="255.005470662422" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="750" font-style="normal" fill="#0F766E">0.503</text><text x="815" y="451" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#0F172A">HIGH</text><text x="500" y="495" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#475569">At high congestion both types choose Partial; at medium congestion the high-cost type still chooses Minimum.</text>
</svg>
