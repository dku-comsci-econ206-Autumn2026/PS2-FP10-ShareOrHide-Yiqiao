<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">Benchmark Bayesian Nash equilibrium matrix</title>
<desc id="desc">A labeled three-by-two matrix showing Minimum for both types at low congestion, Partial and Minimum at medium congestion, and Partial for both types at high congestion.</desc>
<defs><marker id="arrow-2563EB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker><marker id="arrow-0F766E" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0F766E"/></marker><marker id="arrow-C2410C" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#C2410C"/></marker></defs>
<rect width="1000" height="530" rx="24" fill="#F8FAFC"/>
<text x="50" y="54" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700" font-style="normal" fill="#0B3D91">Type-contingent pure BNE under the benchmark</text><text x="50" y="86" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#475569">Rows = public congestion  ·  Columns = operator private confidentiality type</text><rect x="235" y="125" width="630" height="58" rx="10" fill="#0B3D91" stroke="#0B3D91" stroke-width="2"/><text x="392.5" y="162" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#FFFFFF">LOW TYPE</text><text x="707.5" y="162" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#FFFFFF">HIGH TYPE</text><text x="205" y="229" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0B3D91">LOW</text><text x="205" y="255" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#475569">d = 0.3</text><rect x="235" y="195" width="303" height="76" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="386.5" y="241" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#0F172A">Minimum</text><rect x="550" y="195" width="303" height="76" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="701.5" y="241" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#0F172A">Minimum</text><text x="205" y="317" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0B3D91">MEDIUM</text><text x="205" y="343" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#475569">d = 0.6</text><rect x="235" y="283" width="303" height="76" rx="12" fill="#EAF8F2" stroke="#0F766E" stroke-width="2"/><text x="386.5" y="329" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#0F172A">Partial</text><rect x="550" y="283" width="303" height="76" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="701.5" y="329" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#0F172A">Minimum</text><text x="205" y="405" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#0B3D91">HIGH</text><text x="205" y="431" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#475569">d = 1.0</text><rect x="235" y="371" width="303" height="76" rx="12" fill="#EAF8F2" stroke="#0F766E" stroke-width="2"/><text x="386.5" y="417" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#0F172A">Partial</text><rect x="550" y="371" width="303" height="76" rx="12" fill="#EAF8F2" stroke="#0F766E" stroke-width="2"/><text x="701.5" y="417" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#0F172A">Partial</text><rect x="165" y="465" width="670" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="500" y="490" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#475569">Minimum = safety floor only   ·   Partial = added voluntary coordination detail</text>
