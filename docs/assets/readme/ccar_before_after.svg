nt-weight="750" font-style="normal" fill="#C2410C">CCAR</text><text x="550" y="221" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="750" font-style="normal" fill="#C2410C">alpha_M = 0.7</text><rect x="670" y="120" width="380" height="230" rx="18" fill="#EAF8F2" stroke="#0F766E" stroke-width="3"/><text x="860" y="158" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="750" font-style="normal" fill="#0F766E">WITH CCAR</text><text x="710" y="205" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650" font-style="normal" fill="#0F172A">Low type   Partial</text><text x="710" y="247" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="650" font-style="normal" fill="#0F172A">High type  Partial</text><text x="710" y="306" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#475569">Welfare  3.089</text><text x="710" y="334" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="400" font-style="normal" fill="#475569">Gap          0.050</text><rect x="50" y="378" width="1000" height="58" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="550" y="404" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#0F172A">Mandatory safety information remains universal and unchanged.</text><text x="550" y="426" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="650" font-style="normal" fill="#0F172A">Mechanism performance is parameter-dependent.</text>
